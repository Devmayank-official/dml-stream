# =============================================================================
# DML Stream v2.5.1 - GitHub Actions Workflow (HYBRID)
# =============================================================================
# Hybrid CI/CD Pipeline - Production-ready deployment
# Developed by DML Labs | Lead Engineer: @devmayank-official
#
# FEATURES:
# - PyPI Token-based authentication
# - FFmpeg manual installation with fallbacks
# - Non-blocking linting and tests
# - Docker multi-file support (docker/ directory)
# - Multi-platform testing (Ubuntu, Windows, macOS)
# - Multi-Python version testing (3.9, 3.10, 3.11, 3.12)
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master, develop]
  # schedule:
  #   - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYPI_PACKAGE_NAME: dml-stream

jobs:
  # ---------------------------------------------------------------------------
  # Lint Job (Non-blocking)
  # ---------------------------------------------------------------------------
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy

      - name: Run Black (code formatting)
        run: black --check src/ tests/ || true

      - name: Run Ruff (linting)
        run: ruff check src/ tests/ --exit-zero

      - name: Run MyPy (type checking)
        run: mypy src/ --ignore-missing-imports || true

  # ---------------------------------------------------------------------------
  # Test Job (FFmpeg manual installation with fallbacks)
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # ← FFmpeg installation with fallbacks for all platforms
      - name: Install FFmpeg (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg || \
          sudo snap install ffmpeg || \
          echo "FFmpeg install skipped"

      - name: Install FFmpeg (Windows - Chocolatey)
        if: matrix.os == 'windows-latest'
        run: choco install ffmpeg -y || echo "Chocolatey install failed"

      - name: Install FFmpeg (Windows - Winget fallback)
        if: matrix.os == 'windows-latest'
        run: winget install --id Gyan.FFmpeg -e --accept-source-agreements --accept-package-agreements || echo "Winget install skipped"

      - name: Install FFmpeg (macOS - Homebrew)
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg || echo "Homebrew install skipped"

      - name: Install FFmpeg (macOS - MacPorts fallback)
        if: matrix.os == 'macos-latest'
        run: sudo port install ffmpeg || echo "MacPorts install skipped"

      - name: Verify FFmpeg
        run: ffmpeg -version || echo "FFmpeg not available"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit tests
        shell: bash  # ← Force bash shell (not PowerShell)
        run: |
          pytest tests/unit -v \
            --cov=dml_stream \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            || true

      - name: Run integration tests (non-network)
        shell: bash  # ← Force bash shell
        run: |
          pytest tests/integration -v -k "not network" || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-${{ matrix.python-version }}
          fail_ci_if_error: false  # ← Don't fail on Codecov issues
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'

  # ---------------------------------------------------------------------------
  # Build Job
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # Docker Build Job (v2.5.1 - docker/ directory, multi-file)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push (uses docker/ directory)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile  # ← v2.5.0: docker/ directory
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ---------------------------------------------------------------------------
  # Release Job (PyPI Token-based authentication)
  # ---------------------------------------------------------------------------
  release:
    name: PyPI Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pypi
      url: https://pypi.org/p/${{ env.PYPI_PACKAGE_NAME }}

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ← PyPI publishing: Trusted Publishing (primary)
      - name: Publish to PyPI (Trusted Publishing)
        id: trusted_publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          skip-existing: true
          attestations: false
        continue-on-error: true

      # ← Fallback: API Token (if Trusted Publishing fails)
      - name: Publish to PyPI (API Token Fallback)
        if: steps.trusted_publish.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
          skip-existing: true
          attestations: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          discussion_category_name: Announcements

  # ---------------------------------------------------------------------------
  # Security Scan Job (Non-blocking)
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install safety
        run: pip install safety

      - name: Check dependencies for vulnerabilities
        run: safety check --full-report || true

      - name: Run Bandit (security linter)
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()
